spring:
  application:
    name: sga
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sga}
    username: ${DB_USER:sga}
    password: ${DB_PASSWORD:sga}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # el esquema lo gestiona Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
